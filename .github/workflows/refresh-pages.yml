name: Refresh and deploy Opportunity Radar

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: opportunity-radar-pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6-luna' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test
        run: python -m unittest discover -s tests -q

      - name: Refresh collected data and analysis
        run: |
          test -n "$OPENAI_API_KEY"
          test -n "$OPENAI_MODEL"
          python -m opportunity_radar run \
            --db data/opportunity_radar.sqlite3 \
            --reports reports

      - name: Build static Dashboard
        run: python -m opportunity_radar build-pages --db data/opportunity_radar.sqlite3 --output site

      # The SQLite file preserves incremental review/evidence state between runs.
      # Use a private repository if the collected data or analysis is not public.
      - name: Persist state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/opportunity_radar.sqlite3 reports/$(date -u +%F).md
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh opportunity radar [skip ci]"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
