name: Refresh and deploy Opportunity Radar

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: opportunity-radar-pages
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Test
        run: python -m unittest discover -s tests -q

      - name: Refresh collected data and analysis
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6-luna' }}
        run: |
          test -n "$OPENAI_API_KEY"
          test -n "$OPENAI_MODEL"
          python -m opportunity_radar run \
            --db data/opportunity_radar.sqlite3 \
            --reports reports

      - name: Build static Dashboard
        run: python -m opportunity_radar build-pages --db data/opportunity_radar.sqlite3 --output site

      # The SQLite file preserves incremental review/evidence state between runs.
      # Use a private repository if the collected data or analysis is not public.
      - name: Persist state
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/opportunity_radar.sqlite3 reports/$(date -u +%F).md
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh opportunity radar [skip ci]"
            trap 'git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"' EXIT
            git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
